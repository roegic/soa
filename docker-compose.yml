services:
  db:
    image: postgres:14
    container_name: user_db
    restart: always
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: verystrongpassword
      POSTGRES_DB: user_service
    ports:
      - "5433:5432"
    volumes:
      - user_db_data:/var/lib/postgresql/data

  user_service:
    build: ./users_service
    container_name: user_service
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: "postgresql://student:verystrongpassword@user_db:5432/user_service"
      JWT_SECRET_KEY: "super-duper-secret-key"
    ports:
      - "5002:5000"

  posts_db:
    image: postgres:14
    container_name: posts_db
    restart: always
    environment:
      POSTGRES_USER: student
      POSTGRES_PASSWORD: verystrongpassword
      POSTGRES_DB: posts_db
    ports:
      - "5434:5432"
    volumes:
      - posts_db_data:/var/lib/postgresql/data

  posts-service:
    build:
      context: .
      dockerfile: ./posts_service/Dockerfile
    container_name: posts-service
    restart: always
    depends_on:
      - posts_db
    environment:
      DATABASE_URL: "postgresql://student:verystrongpassword@posts_db:5432/posts_db"
    ports:
      - "50051:50051"


  gateway_service:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    container_name: gateway_service
    restart: always
    depends_on:
      - user_service
      - posts-service
    environment:
      USER_SERVICE_URL: "http://user_service:5000"
      POSTS_SERVICE_URL: "posts-service:50051"
      JWT_SECRET_KEY: "super-duper-secret-key"
    ports:
      - "4001:4000"

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_LISTENERS: "controller://:9093,broker://:9092"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: controller
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: broker
      KAFKA_CFG_ADVERTISED_LISTENERS: "broker://localhost:9092"
      KAFKA_CFG_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_CFG_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_CFG_LOG_DIRS: "/bitnami/kafka/logs"
    volumes:
      - kafka_data:/bitnami/kafka
    networks:
      - app_network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: Local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  test_service:
      build:
        context: .
        dockerfile: ./tests/Dockerfile
      container_name: test_service
      environment:
        USER_SERVICE_URL: "http://user_service:5000"
        POSTS_SERVICE_URL: "posts-service:50051"
        DATABASE_URL: 'sqlite:///:memory:'
      profiles:
        - test



volumes:
  posts_db_data:
  user_db_data: